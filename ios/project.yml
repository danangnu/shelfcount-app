# Generate the Xcode project (on a Mac, or on a GitHub Actions macOS runner):
#   brew install xcodegen && cd ios && bash setup.sh && open ShelfCount.xcodeproj
name: ShelfCount
schemes:
  ShelfCount:           # shared scheme, so `xcodebuild -scheme ShelfCount` works in CI
    build:
      targets:
        ShelfCount: all
    run:
      config: Debug
    archive:
      config: Release
options:
  bundleIdPrefix: com.harianda
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  onnxruntime:
    url: https://github.com/microsoft/onnxruntime-swift-package-manager
    from: "1.20.0"
settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: ""   # set your Apple Team ID here or in Xcode > Signing
targets:
  ShelfCount:
    type: application
    platform: iOS
    sources:
      - path: ShelfCount
    dependencies:
      - package: onnxruntime
        product: onnxruntime
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.harianda.shelfcount
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_FILE: ShelfCount/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        OTHER_LDFLAGS: ["-ObjC"]
    info:
      path: ShelfCount/Info.plist
      properties:
        CFBundleDisplayName: ShelfCount
        ShelfCountInputSize: "640"   # must match the imgsz the bundled model was exported with
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSCameraUsageDescription: ShelfCount uses the camera to photograph shelves and count the products on them.
        NSPhotoLibraryUsageDescription: ShelfCount lets you pick shelf photos from your library to count products.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          NSAllowsArbitraryLoads: false
        ITSAppUsesNonExemptEncryption: false
