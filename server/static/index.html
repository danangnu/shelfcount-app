<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ShelfCount</title>
<meta name="theme-color" content="#0f1720">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="top">
  <div class="brand"><img src="icon.svg" alt="" width="28" height="28"><span>ShelfCount</span></div>
  <div class="top-actions">
    <a class="btn ghost" id="exportBtn" href="api/export.csv">Export CSV</a>
    <button class="btn ghost" id="settingsBtn" aria-haspopup="dialog">Settings</button>
  </div>
</header>

<main>
  <section class="upload">
    <label id="drop" class="drop" tabindex="0">
      <input id="file" type="file" accept="image/*" multiple hidden>
      <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M12 16V4m0 0-4 4m4-4 4 4"/><path d="M4 16v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/></svg>
      <strong>Drop shelf photos here</strong>
      <span>or click to choose. Several at once is fine.</span>
    </label>
    <div id="last" class="last" hidden>
      <img id="lastImg" alt="Latest shelf photo with detected products outlined">
      <div class="last-meta">
        <div class="label">Products found</div>
        <div id="lastCount" class="big">0</div>
        <div id="lastInfo" class="muted"></div>
      </div>
    </div>
  </section>

  <div id="progress" class="progress" hidden><div id="bar"></div><span id="progressText"></span></div>

  <section class="stats" aria-label="Totals">
    <div><span class="label">Images</span><b id="sImages">0</b></div>
    <div><span class="label">Products counted</span><b id="sProducts">0</b></div>
    <div><span class="label">Avg. processing</span><b id="sMs">–</b></div>
  </section>

  <section>
    <h2>History</h2>
    <div id="empty" class="empty">No photos yet. Drop one above to get a count.</div>
    <ul id="history" class="history"></ul>
    <button id="more" class="btn ghost more" hidden>Load more</button>
  </section>
</main>

<dialog id="viewer">
  <form method="dialog" class="viewer-head">
    <div><b id="vCount"></b> <span id="vMeta" class="muted"></span></div>
    <div class="viewer-actions">
      <label class="toggle"><input type="checkbox" id="vOverlay" checked> Boxes</label>
      <button type="button" class="btn danger" id="vDelete">Delete</button>
      <button class="btn">Close</button>
    </div>
  </form>
  <img id="vImg" alt="Shelf photo">
</dialog>

<dialog id="settings">
  <form method="dialog" class="settings">
    <h3>Settings</h3>
    <label>Detection confidence <output id="confOut"></output>
      <input type="range" id="conf" min="0.05" max="0.8" step="0.01">
      <small>Lower finds more products but may add false ones. Default comes from the server.</small>
    </label>
    <label>API key (only if the server requires one)
      <input type="password" id="apiKey" autocomplete="off">
    </label>
    <div id="modelInfo" class="muted small"></div>
    <div class="row"><button class="btn">Done</button></div>
  </form>
</dialog>

<div id="toast" role="status" aria-live="polite"></div>
<script src="app.js"></script>
</body>
</html>
